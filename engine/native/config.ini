# Face unlock engine settings. System Settings > Face Unlock edits these.
# Keys follow Howdy's config.ini.

[core]
# Show "Attempting facial authentication"; the login and lock screen animation needs it
detection_notice = true
# Don't show "Identified face as <user>"
no_confirmation = false
abort_if_ssh = true
abort_if_lid_closed = true
# Turn face unlock off without touching PAM
disabled = false
# Like a phone after a restart: face unlock works only once you have signed in
# with your password (or fingerprint) since the computer started
password_after_boot = true
# After this many faces that were seen but not recognized within failure_window
# minutes, refuse face unlock for that user for lockout_minutes (the password still
# works), like pam_faillock. 0 turns the limit off.
max_failures = 5
failure_window = 15
lockout_minutes = 10

[video]
# Highest match score that is accepted, (1 - cosine similarity) x 10; lower is stricter
certainty = 6.0
# Seconds to look for a face before giving up
timeout = 4
# Camera; written down on first setup (an IR camera if there is one). While it says none, an
# IR camera is looked for at each scan; an ordinary webcam has to be chosen in Set Up.
device_path = none
# true for an ordinary colour webcam: use colour frames. Less secure than IR (a photo
# can fool it) and it needs your face lit from the front.
colour = false
# Lowest detector confidence (0 to 1) for a face to be considered
detection_threshold = 0.8
# Also look for faces turned sideways: 0 no, 1 upright and portrait, 2 portrait only
rotate = 0
# Frames are scaled down to this height before detection
max_height = 320
# Skip frames where more than this share (%) of pixels is near black
dark_threshold = 60
