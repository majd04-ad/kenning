version = 1

# Files that cannot carry a header. Code files carry their own SPDX headers.

[[annotations]]
path = ["**/PKGBUILD", ".gitignore", "README.md", "THEMES.md", "ROADMAP.md", "SECURITY.md", "docs/DESIGN.md", "**/CMakeLists.txt", "**/*.json",
        "**/*.ini", "**/*.actions", "packaging/arch/*.hook", "packaging/aur/*/.SRCINFO", "packaging/debian/**", "packaging/rpm/*.spec", "docs/images/**"]
SPDX-FileCopyrightText = "2026 Rishon Jonathan R"
SPDX-License-Identifier = "CC0-1.0"

# Public keys of KDE's release signers, as published on keyservers
[[annotations]]
path = ["keys/pgp/*.asc", "packaging/aur/*/keys/pgp/*.asc"]
SPDX-FileCopyrightText = "KDE release signers"
SPDX-License-Identifier = "CC0-1.0"

# Changes to KDE's Plasma Login Manager; the patched files keep their licences.
[[annotations]]
path = "login-manager/patches/*.patch"
SPDX-FileCopyrightText = ["2026 Rishon Jonathan R", "KDE contributors"]
SPDX-License-Identifier = "GPL-2.0-or-later AND LGPL-2.0-or-later"

# Kenning's polkit dialog keeps polkit-kde-agent-1's D-Bus interface, which has no header there.
[[annotations]]
path = "polkit-agent/org.kde.Polkit1AuthAgent.xml"
SPDX-FileCopyrightText = "KDE contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"
